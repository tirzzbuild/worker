name: Build Flutter APK (ZIP mode)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from bot'
        required: true
        type: string
      userId:
        description: 'Telegram user ID'
        required: true
        type: string
      payload:
        description: 'JSON payload from bot'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse payload
        id: meta
        run: |
          echo '${{ inputs.payload }}' > /tmp/payload.json
          python3 << 'EOF'
          import json, os
          d = json.load(open('/tmp/payload.json'))
          app_name = d.get('appName', 'MyApp')
          build_type = d.get('buildType', 'release')
          zip_url = d.get('zipAssetUrl', '')
          print(f"app_name={app_name}")
          print(f"build_type={build_type}")
          print(f"zip_url={zip_url}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"app_name={app_name}\n")
              f.write(f"build_type={build_type}\n")
              f.write(f"zip_url={zip_url}\n")
          EOF

      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_URL: ${{ steps.meta.outputs.zip_url }}
        run: |
          set -e
          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: zipAssetUrl kosong di payload"
            exit 1
          fi
          echo "Downloading ZIP from: $ZIP_URL"
          # zipAssetUrl adalah GitHub API asset URL → butuh Authorization
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "$ZIP_URL"
          ls -lah project.zip
          mkdir -p project
          unzip -q project.zip -d project
          # Kalau ZIP berisi 1 folder root, masuk ke dalamnya
          if [ \( (ls project | wc -l) -eq 1 ] && [ -d "project/ \)(ls project)" ]; then
            mv project/$(ls project)/* project/ 2>/dev/null || true
            mv project/$(ls project)/.* project/ 2>/dev/null || true
          fi
          ls -la project/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Flutter pub get
        working-directory: project
        run: |
          flutter pub get
          flutter --version

      - name: Build APK
        working-directory: project
        run: |
          BUILD_TYPE='${{ steps.meta.outputs.build_type }}'
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            OUT_DIR=build/app/outputs/flutter-apk
            cp $OUT_DIR/app-debug.apk /tmp/app.apk || cp $(find $OUT_DIR -name "*.apk" | head -1) /tmp/app.apk
          else
            flutter build apk --release
            OUT_DIR=build/app/outputs/flutter-apk
            cp $OUT_DIR/app-release.apk /tmp/app.apk || cp $(find $OUT_DIR -name "*.apk" | head -1) /tmp/app.apk
          fi
          ls -lah /tmp/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: /tmp/app.apk
          retention-days: 1
          if-no-files-found: error
